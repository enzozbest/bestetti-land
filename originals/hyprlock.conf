# Hyprlock — Elegant Apple × Intimidating Arch Elitist
# Drop-in: ~/.config/hypr/hyprlock.conf
#
# Uses a blurred screenshot background (macOS glass).
# If you prefer a fixed wallpaper, replace `path = screenshot` with an absolute image path.

general {
    grace = 2
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock

    fingerprint:enabled = true
    fingerprint:ready_message = (scan fingerprint)
    fingerprint:present_message = scanning…
    fingerprint:retry_delay = 250
}

background {
    monitor =
    path = screenshot
    color = rgba(17, 17, 27, 0.55)

    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 1.05
    brightness = 0.85
    vibrancy = 0.25
    vibrancy_darkness = 0.25
}

# Subtle vignette / focus panel
shape {
    monitor =
    size = 2000, 1400
    position = 0, 0
    halign = center
    valign = center
    color = rgba(0, 0, 0, 0.18)
    rounding = 80
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 0.95)
    font_size = 84
    font_family = JetBrainsMono NF ExtraBold
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Date
label {
    monitor =
    text = cmd[update:1000] date +"%A · %d %b %Y"
    color = rgba(186, 194, 222, 0.90)
    font_size = 18
    font_family = JetBrainsMono NF
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
}

# Tiny flex line
label {
    monitor =
    text = cmd[update:2000] echo "arch · hyprland · $(uname -r | cut -d- -f1)"
    color = rgba(166, 173, 200, 0.70)
    font_size = 13
    font_family = JetBrainsMono NF
    position = 0, 28
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = cmd[update:60000] echo "$USER"
    color = rgba(203, 166, 247, 0.90)
    font_size = 16
    font_family = JetBrainsMono NF SemiBold
    position = 0, -40
    halign = center
    valign = center
}

# Password input (glass pill)
input-field {
    monitor =
    size = 380, 54
    position = 0, -110
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = rgba(137, 180, 250, 0.25)
    inner_color = rgba(24, 24, 37, 0.35)
    font_color  = rgba(205, 214, 244, 0.95)

    rounding = 16
    fade_on_empty = false
    placeholder_text = <span foreground="##bac2de">password</span>

    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    check_color = rgba(148, 226, 213, 0.55)
    fail_color  = rgba(243, 139, 168, 0.60)
    capslock_color = rgba(249, 226, 175, 0.55)

    shadow_passes = 2
    shadow_size = 6
}

label {
    monitor =
    text = cmd[update:1000] echo "⏎ unlock · esc cancel"
    color = rgba(166, 173, 200, 0.60)
    font_size = 12
    font_family = JetBrainsMono NF
    position = 0, -165
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(186, 194, 222, 0.75)
    font_size = 12
    font_family = JetBrainsMono NF
    position = 0, -190
    halign = center
    valign = center
}
