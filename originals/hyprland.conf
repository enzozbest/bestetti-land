# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################
# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# ─────────────────────────────────────────────────────────────────────────────
# Recommended packages (Wayland QoL)
# ─────────────────────────────────────────────────────────────────────────────
# Core:   waybar, wofi, kitty/alacritty, hyprpaper, hyprlock, hypridle
# Notify: swaync (or mako), libnotify
# Audio:  wireplumber, pipewire, pipewire-pulse, pavucontrol
# Screens: grim, slurp, wl-clipboard, cliphist
# Power:  wlogout (or your hyprshutdown script)
# Media:  playerctl
# Bright: brightnessctl
# Extras: bluez, blueman; thunar/nautilus; xdg-desktop-portal-hyprland
#
monitor=eDP-1,2560x1600@240,0x0,1
monitor=HDMI-A-1,2560x1440@144,auto,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = wofi


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general

# Smart-gaps effect: remove gaps when only 1 tiled window on the workspace
workspace = w[t1], gapsout:0, gapsin:0

# SwayNC Control Center glass
layerrule {
    name = swaync-cc-blur
    match:namespace = swaync-control-center
    blur = on
    ignore_alpha = 0.5
    xray = 0
}

# SwayNC pop-up notifications glass
layerrule {
    name = swaync-popup-blur
    match:namespace = swaync-notification-window
    blur = on
    ignore_alpha = 0.5
    xray = 0
}

general {
    # macOS-but-better: slightly tighter, cleaner gaps
    gaps_in = 6
    gaps_out = 16

    border_size = 2

    # Subtle gradient border for the active window
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(585b70aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    # macOS-but-better: rounder, softer
    rounding = 12
    rounding_power = 2

    # Slightly de-emphasize unfocused windows (Apple-y)
    active_opacity = 1.0
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 4
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 18
        passes = 4
    }
}

# Waybar blur
layerrule {
    name = waybar-blur
    match:namespace = waybar
    blur = on
    ignore_alpha = 0.2
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # macOS-esque curves
    bezier = macOut,    0.16, 1.00, 0.30, 1.00
    bezier = macInOut,  0.65, 0.00, 0.35, 1.00
    bezier = quick,     0.20, 0.00, 0.10, 1.00

    animation = global,        1,  8,  macInOut
    animation = border,        1,  6,  macOut
    animation = windows,       1,  6,  macOut
    animation = windowsIn,     1,  7,  macOut,  popin 90%
    animation = windowsOut,    1,  6,  macOut,  popin 90%
    animation = fade,          1,  6,  quick
    animation = layers,        1,  6,  macOut
    animation = workspaces,    1,  6,  macInOut, slidefade 10%
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true

    # macOS-but-better: prevents weird focus jumps on some setups
    focus_on_activate = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# macOS-but-better: 3-finger workspace swipe
gesture = 3, horizontal, workspace


# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit, # dwindle
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, F, fullscreen
bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot.png
bind = $mainMod, W, exec, firefox-developer-edition
bind = $mainMod, L, exec, loginctl lock-session
#My custom binds
bind = CTRL ALT, W, exec, firefox-developer-edition

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}


# ─────────────────────────────────────────────────────────────────────────────
# macOS-but-better spice pack (safe defaults)
# ─────────────────────────────────────────────────────────────────────────────

# Better floating dialogs (centered + sized nicely)
windowrule {
    name = float-and-center-dialogs
    match:title = (Open File|Save File|Choose Files|File Upload|Preferences|Settings)
    float = yes
    center = yes
    size = 900 650
}

windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = yes
    center = yes
    size = 900 650
}

windowrule {
    name = float-blueman
    match:class = ^(blueman-manager)$
    float = yes
    center = yes
    size = 900 650
}

# Scratchpad feels nicer when it is centered
windowrule {
    name = scratchpad-center
    match:workspace = special:magic
    center = yes
}

# QoL: quick launcher + emoji picker spot (edit command if you don't have it)
bind = $mainMod, SPACE, exec, wofi --show drun
# bind = $mainMod, period, exec, wofi-emoji

# QoL: focus follows mouse less aggressively (toggle)
bind = $mainMod, Z, exec, hyprctl keyword input:follow_mouse 0 && notify-send "Hyprland" "follow_mouse: 0"
bind = $mainMod SHIFT, Z, exec, hyprctl keyword input:follow_mouse 1 && notify-send "Hyprland" "follow_mouse: 1"

# ─────────────────────────────────────────────────────────────────────────────
# CS VIBE PACK: “I read the wiki. Twice.”
# ─────────────────────────────────────────────────────────────────────────────

# JetBrains / IDE dialogs: float + center (stops them tiling like animals)
windowrule {
    name = float-jetbrains-dialogs
    match:class = ^(jetbrains-.*|idea|clion|pycharm|webstorm|goland|rustrover)$
    match:title = (Settings|Preferences|Project Structure|Find|Replace|Search|Open File|Save File)
    float = yes
    center = yes
    size = 1050 720
}

# Picture-in-Picture: always float + pin
windowrule {
    name = pip-float
    match:title = (Picture-in-Picture|PiP)
    float = yes
    pin = yes
    size = 640 360
}

# Audio / Bluetooth managers: float (cleaner workflow)
windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = yes
    center = yes
    size = 950 650
}

windowrule {
    name = float-blueman
    match:class = ^(blueman-manager)$
    float = yes
    center = yes
    size = 900 650
}

# Scratchpad should feel intentional
windowrule {
    name = scratchpad-center
    match:workspace = special:magic
    center = yes
}

# ─── Power / lock / launcher QoL ───
# (Install these tools from the package list below; binds won't break if missing, they'll just do nothing.)

bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, $terminal -e zsh -lc 'cd "$(pwd)" 2>/dev/null || true; exec zsh'

bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, grave, exec, wofi --show run

bind = $mainMod ALT, L, exec, hyprlock
bind = $mainMod SHIFT, P, exec, wlogout
bind = $mainMod CTRL, R, exec, hyprctl reload && notify-send "Hyprland" "Reloaded config"

# Screenshot suite (more civilized than random ~/Pictures/screenshot.png overwrites)
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod CTRL, Print, exec, grim -g "$(slurp)" ~/Pictures/shot-$(date +%F_%H-%M-%S).png

# Window management extra polish
bind = $mainMod, T, togglegroup
bind = $mainMod SHIFT, T, lockactivegroup, toggle

# Optional: quick “focus mode” (toggle gaps to 0/0 temporarily)
bind = $mainMod, G, exec, hyprctl keyword general:gaps_in 0 && hyprctl keyword general:gaps_out 0 && notify-send "Hyprland" "Gaps: 0"
bind = $mainMod SHIFT, G, exec, hyprctl keyword general:gaps_in 6 && hyprctl keyword general:gaps_out 16 && notify-send "Hyprland" "Gaps: 6/16"



exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = /home/enzozbest/.config/hypr/wallpaper.sh
exec-once = waybar
exec-once = swaync
exec-once = blueman-applet
exec-once = easyeffects --gapplication-service
