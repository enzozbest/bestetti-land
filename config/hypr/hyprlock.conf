# MIDNIGHT GLASS · blurred desktop, a readable clock, one focused input.
general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint to unlock
    fingerprint:present_message = Scanning…
    fingerprint:retry_delay = 250
}

background {
    monitor =
    path = screenshot
    color = rgba(11111bff)
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.15
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 100
    font_family = Inter Display Medium
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(bac2deff)
    font_size = 18
    font_family = Inter
    position = 0, 76
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(b4befeff)
    font_size = 16
    font_family = Inter Medium
    position = 0, -8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    position = 0, -70
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgba(b4befe99) rgba(89b4fa66) 45deg
    inner_color = rgba(181825b3)
    font_color = rgba(cdd6f4ff)
    font_family = Inter
    rounding = 18
    fade_on_empty = false
    placeholder_text = Password
    dots_spacing = 0.22
    dots_center = true
    check_color = rgba(94e2d5ff)
    fail_color = rgba(f38ba8ff)
    capslock_color = rgba(f9e2afff)
    fail_text = $FAIL
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = Enter to unlock · Esc to clear
    color = rgba(a6adc8ff)
    font_size = 12
    font_family = Inter
    position = 0, -125
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(a6adc8ff)
    font_size = 12
    font_family = Inter
    position = 0, -154
    halign = center
    valign = center
}

label {
    monitor =
    text = ARCH / HYPRLAND
    color = rgba(7f849ccc)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 42
    halign = center
    valign = bottom
}
